; Starting renderer/engine configuration for the benchmark project skeleton.
;
; These values are a sane baseline, not a tuned answer. Anything performance-related here
; depends on the world that gets built, the hardware it runs on and the engine version, so
; treat every line as something to re-measure rather than inherit. In particular: profile
; before and after changing scalability, and set quality levels deliberately -- an editor
; default can leave a project rendering at cinematic quality, which no shipping game does.

