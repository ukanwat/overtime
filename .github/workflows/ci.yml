name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  package:
    name: Package installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm pack
      - name: Install the tarball globally, without dev dependencies
        run: |
          npm install -g ./ukanwat-overtime-*.tgz
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          ls -la "$(npm prefix -g)/bin"
      - name: Run it
        env:
          OVERTIME_HOME: ${{ runner.temp }}/overtime-home
        run: |
          mkdir -p "$OVERTIME_HOME"
          echo '{"autostartAsked":true}' > "$OVERTIME_HOME/settings.json"
          overtime help
          overtime new smoke
          overtime ls
          overtime daemon stop
